---
name: Mend SCA Security Scan
on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - .github/**
      - docs/**
      - examples/**
      - .goreleaser.yml
      - .gitleaks.toml
      - "*.md"
  push:
    branches:
      - main
    paths-ignore:
      - .github/**
      - docs/**
      - examples/**
      - .goreleaser.yml
      - .gitleaks.toml
      - "*.md"
permissions: read-all
jobs:
  mend-sca:
    name: Mend dependency scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5  # v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download and install Mend CLI
        env:
          # Pin the self-contained Mend CLI to a specific, immutable version and verify
          # its SHA-256. This is the path-versioned artifact documented at
          # https://docs.mend.io/platform/latest/product-downloads (Download Self-Contained CLI).
          # Unlike the rolling "latest" download, a version-pinned artifact never goes
          # stale, so CI does not break every time Mend ships a new CLI; it only changes
          # when MEND_CLI_VERSION (and the matching SHA-256) is deliberately bumped.
          # Note: Mend keeps each self-contained version available for ~6 months after release.
          MEND_CLI_VERSION: "26.8.2-hf1"
          MEND_CLI_SHA256: "399907c14b8fc5a5aa23e42e7214bae1b82a91a41160a2d444f132e25223f6ee"
        run: |
          set -euo pipefail
          url="https://downloads.mend.io/cli-standalone/${MEND_CLI_VERSION}/mend_linux_amd64_${MEND_CLI_VERSION}.tgz"
          # Download over HTTPS to a file (never pipe a remote script into a shell), then
          # verify the pinned SHA-256 BEFORE extracting or executing. sha256sum -c exits
          # non-zero on mismatch and, with `set -e`, fails the job closed.
          curl -fsSL --retry 3 --retry-delay 5 --retry-connrefused "${url}" -o /tmp/mend.tgz
          echo "${MEND_CLI_SHA256}  /tmp/mend.tgz" | sha256sum -c -
          tar -xzf /tmp/mend.tgz -C /tmp
          install -m 0755 /tmp/mend-linux-amd64/mend /usr/local/bin/mend
          mend version

      - name: Run Mend dependency scan
        id: mend_scan
        continue-on-error: true
        env:
          MEND_EMAIL: ${{ secrets.MEND_EMAIL }}
          MEND_USER_KEY: ${{ secrets.MEND_USER_KEY }}
          MEND_URL: ${{ secrets.MEND_URL }}
        run: |
          mend dep --dir . --scope "terraform-provider-citrixadc" --non-interactive --export-results mend-results.json

      - name: Convert results to SARIF
        if: always() && steps.mend_scan.outcome != 'skipped'
        continue-on-error: true
        env:
          MEND_EMAIL: ${{ secrets.MEND_EMAIL }}
          MEND_USER_KEY: ${{ secrets.MEND_USER_KEY }}
          MEND_URL: ${{ secrets.MEND_URL }}
        run: |
          mend dep --dir . --scope "terraform-provider-citrixadc" --non-interactive --format sarif --filename mend-output.sarif || true

      - name: Upload Mend SARIF to GitHub Security tab
        if: always() && hashFiles('mend-output.sarif') != ''
        uses: github/codeql-action/upload-sarif@256d634097be96e792d6764f9edaefc4320557b1  # v4
        with:
          sarif_file: mend-output.sarif

      - name: Upload scan results as artifact
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: mend-scan-results
          path: |
            mend-results.json
            mend-output.sarif
          retention-days: 30

      - name: Fail on scan errors
        if: steps.mend_scan.outcome == 'failure'
        run: |
          echo "::error::Mend dependency scan found vulnerabilities or encountered errors."
          exit 1
