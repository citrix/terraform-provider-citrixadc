# Minimal workflows file for the citrixadc_nitro_resource sample (nitro_resource.tf).
#
# This mirrors the format of citrixadc_framework/acctests/testdata/workflows.yaml
# but contains only the single workflow the sample uses. The top-level key MUST be
# "workflow"; each child key (here "nsacl") is a workflow selectable via the
# resource's `workflow` attribute.
#
# Keys consumed by the Go resource for the `object` lifecycle:
#   lifecycle                  : selects the CRUD flavour (object)
#   endpoint                   : NITRO resource type (nsacl)
#   primary_id_attribute       : which configured attribute is the object name/id
#   resource_missing_errorcode : NITRO errorcode returned when the object is absent
#                                (258 = "No such resource" for nsacl)
# The remaining keys below (allow_recreate, non_updateable_attributes) are
# descriptive metadata only; the Go resource does not read them.
workflow:

  nsacl:
    lifecycle: object
    endpoint: nsacl
    primary_id_attribute: aclname
    resource_missing_errorcode: 258
    allow_recreate: true
    non_updateable_attributes:
      - aclname
      - aclaction
